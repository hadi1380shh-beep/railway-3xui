<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Mario HD - نسخه حرفه‌ای</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#1a1a2e;overscroll-behavior:none}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Vazirmatn', sans-serif;
    overflow:hidden;
    touch-action:none;
    -webkit-tap-highlight-color: transparent;
  }
  /* crisp pixel rendering */
  canvas{
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #gameWrap{
    position:relative;
    width: min(100vw, 1280px);
    height: min(100vh, 720px);
    aspect-ratio: 16/9;
    background:#5C94FC;
    border:5px solid #000;
    box-shadow:
      0 0 0 3px #fff,
      0 0 0 8px #000,
      0 30px 80px rgba(0,0,0,0.6);
    border-radius: 4px;
    overflow:hidden;
  }
  @media (max-width: 800px){
    #gameWrap{
      width:100vw;
      height:100vh;
      border:none;
      box-shadow:none;
      border-radius:0;
      aspect-ratio:auto;
    }
  }

  #game{
    display:block;
    width:100%;
    height:100%;
    background:#5C94FC;
  }

  /* TOP HUD - crisp, no blur */
  #hud{
    position:absolute;
    top:0;left:0;right:0;
    height:68px;
    background:#000;
    border-bottom:4px solid #fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    z-index:20;
    pointer-events:none;
  }
  .hudGroup{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .hudItem{
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    text-shadow:none;
    letter-spacing:-0.5px;
  }
  .hudItem b{color:#FFD700}
  .coinPixel{
    width:20px;height:20px;
    background:#FFD700;
    border:3px solid #000;
    box-shadow: inset -3px -3px 0 #FF8C00, inset 2px 2px 0 #FFFF8F;
    display:inline-block;
    position:relative;
  }
  .coinPixel::after{
    content:'';
    position:absolute;
    top:3px;left:3px;width:4px;height:4px;background:#FFFFB0;
  }
  .heart{color:#E52521;font-size:18px;text-shadow:0 2px 0 #000;letter-spacing:2px}

  /* SCREENS */
  .screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    background:#5C94FC;
  }
  .screen::before{
    content:'';
    position:absolute;
    inset:0;
    background:
      linear-gradient(rgba(0,0,0,0.08) 50%, transparent 50%);
    background-size:100% 4px;
    pointer-events:none;
    opacity:0.3;
  }
  #gameOverScreen, #winScreen{display:none}
  
  .logo{
    font-family:'Press Start 2P', monospace;
    font-size: clamp(28px, 6vw, 52px);
    line-height:1.1;
    color:#FFD700;
    -webkit-text-stroke:3px #000;
    text-shadow:
      6px 6px 0 #000,
      -2px -2px 0 #E52521,
      2px -2px 0 #E52521,
      -2px 2px 0 #E52521;
    margin-bottom:12px;
    letter-spacing:-3px;
  }
  .subtitle{
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    color:#fff;
    background:#000;
    padding:8px 14px;
    border:3px solid #fff;
    margin-bottom:20px;
    box-shadow:4px 4px 0 #000;
  }
  .desc{
    font-family:'Vazirmatn', sans-serif;
    font-weight:700;
    font-size:18px;
    color:#fff;
    text-shadow:2px 2px 0 #000;
    background:rgba(0,0,0,0.6);
    padding:12px 18px;
    border:3px solid #000;
    max-width:560px;
    line-height:1.7;
    box-shadow:6px 6px 0 #000;
  }

  .btn{
    margin-top:22px;
    font-family:'Press Start 2P', monospace;
    font-size:14px;
    padding:16px 32px;
    background:#E52521;
    color:#fff;
    border:4px solid #000;
    box-shadow: 0 8px 0 #000, inset 0 -4px 0 #8B0000, inset 0 4px 0 #FF6B6B;
    cursor:pointer;
    transition:none;
    position:relative;
    top:0;
  }
  .btn:active{
    top:6px;
    box-shadow: 0 2px 0 #000, inset 0 -2px 0 #8B0000;
  }
  .btn.green{
    background:#00B800;
    box-shadow: 0 8px 0 #000, inset 0 -4px 0 #005000, inset 0 4px 0 #6FFF6F;
  }
  .btn.green:active{box-shadow:0 2px 0 #000, inset 0 -2px 0 #005000}

  .keyBox{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:32px;height:28px;
    padding:0 6px;
    background:#fff;
    border:3px solid #000;
    border-bottom-width:5px;
    border-radius:4px;
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    color:#000;
    margin:0 3px;
    box-shadow:0 2px 0 rgba(0,0,0,0.2);
  }

  /* TOUCH CONTROLS - COMPLETELY REDESIGNED, NO BLUR */
  #touch{
    position:absolute;
    bottom:0;left:0;right:0;
    height:140px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    z-index:25;
    pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
  }
  .dpad{
    display:flex;
    gap:14px;
    pointer-events:auto;
  }
  .tBtn{
    width:84px;height:84px;
    background:#fff;
    border:4px solid #000;
    border-radius:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 0 #000;
    cursor:pointer;
    position:relative;
    top:0;
    transition:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .tBtn:active, .tBtn.pressed{
    top:6px;
    box-shadow:0 2px 0 #000;
    background:#E8E8E8;
  }
  .tBtn .icon{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
  }
  .tBtn .icon svg{width:100%;height:100%}
  .tBtn .label{
    font-family:'Press Start 2P', monospace;
    font-size:8px;
    margin-top:4px;
    color:#000;
    letter-spacing:-0.5px;
  }
  .tBtn.jump{
    width:110px;height:110px;
    background:#E52521;
    border-radius:50%;
    box-shadow: 0 10px 0 #000, inset 0 -6px 0 #8B0000, inset 0 6px 0 #FF6B6B;
    border-width:5px;
  }
  .tBtn.jump:active, .tBtn.jump.pressed{
    background:#C41E1A;
    box-shadow:0 3px 0 #000, inset 0 -3px 0 #8B0000;
    top:7px;
  }
  .tBtn.jump .label{color:#fff; font-size:10px; text-shadow:0 2px 0 #000}
  .tBtn.jump .icon{width:44px;height:44px}

  /* hide touch on desktop with fine pointer unless touched */
  @media (pointer: fine) and (hover: hover){
    #touch{opacity:0;transition:opacity 0.2s}
    #gameWrap:hover #touch{opacity:1}
  }
  @media (max-width: 800px){
    #touch{height:130px}
    .tBtn{width:74px;height:74px;border-radius:14px;box-shadow:0 6px 0 #000}
    .tBtn.jump{width:92px;height:92px}
  }

  /* scanline toggle */
  #gameWrap.crt::after{
    content:'';
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
    z-index:5;
  }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud">
    <div class="hudGroup">
      <div class="hudItem"><span class="coinPixel"></span> <b id="coinCount">00</b> x <span id="score">0000</span></div>
      <div class="hudItem">TIME <b id="timer">300</b></div>
    </div>
    <div class="hudGroup">

  </div>

  <div id="touch">
    <div class="dpad">

          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 L9 12 L15 6"/></svg>
        </div>

      </div>
      <div class="tBtn" id="btnRight">
        <div class="icon">

        </div>
        <div class="label">راست</div>
      </div>
    </div>
    <div class="dpad">
      <div class="tBtn jump" id="btnJump">

  <div id="startScreen" class="screen">

    <div class="desc">

      <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

    <button class="btn" id="startBtn">شروع بازی ▶</button>

<script>
/* ================= HD MARIO ENGINE ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;

const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 100;

let keys = {}, keysPrev = {};
let gameState = 'menu';
let camera = {x:0, y:0, targetX:0};
let particles = [], dustParticles = [];
let score=0, coins=0, lives=3, timeLeft=300;
let levelWidth = 4200;
let shake=0;
let frameCount=0;
let audioCtx;

function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playSound(type){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const mk = (freqs, times, vol=0.35)=>{
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(f, now+(times[i]||0));
      if(times.length>1) o.frequency.linearRampToValueAtTime(freqs[i+1]||f, now+(times[i+1]||times[i]+0.1));
      g.gain.setValueAtTime(vol, now+(times[i]||0));
      g.gain.exponentialRampToValueAtTime(0.001, now+(times[i]||0)+0.25);
      o.start(now+(times[i]||0)); o.stop(now+(times[i]||0)+0.3);
    });
  };
  if(type==='jump'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(300, now); o.frequency.linearRampToValueAtTime(800, now+0.12);
    g.gain.setValueAtTime(0.22, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.22);
    o.start(now); o.stop(now+0.22);
  } else if(type==='coin'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(900, now); o.frequency.linearRampToValueAtTime(1400, now+0.12);
    g.gain.setValueAtTime(0.28, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.35);
    o.start(now); o.stop(now+0.35);
    const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.frequency.setValueAtTime(1800, now+0.08);
    g2.gain.setValueAtTime(0.18, now+0.08); g2.gain.exponentialRampToValueAtTime(0.001, now+0.28);
    o2.start(now+0.08); o2.stop(now+0.28);
  } else if(type==='stomp'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sawtooth'; o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(180, now); o.frequency.exponentialRampToValueAtTime(60, now+0.18);
    g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.2);
    o.start(now); o.stop(now+0.2);
  } else if(type==='die'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sawtooth'; o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(500, now); o.frequency.linearRampToValueAtTime(40, now+0.7);
    g.gain.setValueAtTime(0.35, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.8);
    o.start(now); o.stop(now+0.8);
  } else if(type==='win'){
    [523,659,784,1046].forEach((f,i)=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0.25, now+i*0.13); g.gain.exponentialRampToValueAtTime(0.001, now+i*0.13+0.4);
      o.start(now+i*0.13); o.stop(now+i*0.13+0.4);
    });
  }
}

/* LEVEL */

  enemies = [
    {x:700,y:GROUND_Y-36,w:36,h:36,vx:-1.3,dir:-1,alive:true,anim:0},

    {x:1510,y:GROUND_Y-200-36,w:36,h:36,vx:-0.9,dir:-1,alive:true,anim:0,patrol:{min:1500,max:1740}},
  ];
  flag = {x:4100, y:GROUND_Y-320, w:12, h:320, poleY:GROUND_Y-320, flagY:GROUND_Y-320, reached:false};
  clouds = [
    {x:180,y:90,w:140,h:60},{x:520,y:130,w:180,h:70},{x:980,y:80,w:160,h:65},
    {x:1600,y:110,w:170,h:68},{x:2200,y:70,w:200,h:75},{x:2900,y:100,w:160,h:60},{x:3600,y:120,w:180,h:70},
  ];
  hills = [
    {x:80,y:GROUND_Y-80,w:240,h:80},{x:680,y:GROUND_Y-100,w:300,h:100},{x:1500,y:GROUND_Y-70,w:220,h:70},
    {x:2400,y:GROUND_Y-90,w:280,h:90},{x:3200,y:GROUND_Y-80,w:240,h:80},
  ];
  bushes = [
    {x:350,y:GROUND_Y-28,w:100,h:28},{x:1250,y:GROUND_Y-28,w:140,h:28},{x:2100,y:GROUND_Y-28,w:120,h:28},{x:3000,y:GROUND_Y-28,w:160,h:28},
  ];
}

/* PLAYER - PRECISE CONTROLS */
let player;
function resetPlayer(){
  player = {
    x:100, y:GROUND_Y-60,
    w:32, h:52,
    vx:0, vy:0,
    speed:4.2,
    runSpeed:6.2,
    jumpForce:-13.5,
    onGround:false,
    facing:1,
    state:'idle',
    animFrame:0,
    animTimer:0,
    coyote:0,
    jumpBuffer:0,
    invincible:0,
    wasOnGround:false,
  };
}

window.addEventListener('keydown', e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){
    player.jumpBuffer=10;
    initAudio();
  }
});
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

function bindTouch(id, code){
  const el=document.getElementById(id);
  if(!el) return;
  const on = (v)=>{
    keys[code]=v;
    el.classList.toggle('pressed', v);
    if(v) initAudio();
    if(v && code==='Space') player.jumpBuffer=10;
  };
  el.addEventListener('touchstart', e=>{e.preventDefault(); on(true)}, {passive:false});
  el.addEventListener('touchend', e=>{e.preventDefault(); on(false)}, {passive:false});
  el.addEventListener('touchcancel', e=>{e.preventDefault(); on(false)}, {passive:false});
  el.addEventListener('mousedown', ()=>on(true));
  el.addEventListener('mouseup', ()=>on(false));
  el.addEventListener('mouseleave', ()=>on(false));
}
bindTouch('btnLeft','ArrowLeft');
bindTouch('btnRight','ArrowRight');
bindTouch('btnJump','Space');

function rect(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function spawnParticles(x,y,count,color){
  for(let i=0;i<count;i++){
    particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-1)*7-2,life:28+Math.random()*20,maxLife:28+Math.random()*20,color,size:2+Math.random()*5});
  }
}
function spawnDust(x,y,dir){
  dustParticles.push({x,y,vx:dir*(1+Math.random()*2),vy:-Math.random()*2,life:18,maxLife:18,size:3+Math.random()*3});
}

function startGame(){
  initAudio();
  buildLevel();
  resetPlayer();
  particles=[]; dustParticles=[];
  score=0; coins=0; lives=3; timeLeft=300;
  camera.x=0; camera.targetX=0;
  gameState='playing';
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('winScreen').style.display='none';
  updateUI();
  lastTime=performance.now();
  requestAnimationFrame(loop);
}
document.getElementById('startBtn').addEventListener('click', startGame);

let lastTime=0;
function loop(t){
  if(gameState!=='playing') return;
  const dt = Math.min(32, t-lastTime)/16.666;
  lastTime=t;
  frameCount++;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  timeLeft -= dt/60;
  if(timeLeft<=0) return die();

  // precise input
  let move=0;
  if(keys['ArrowLeft']||keys['KeyA']) move=-1;
  if(keys['ArrowRight']||keys['KeyD']) move=1;
  const isRunning = keys['ShiftLeft']||keys['ShiftRight'];
  const targetSpeed = isRunning ? player.runSpeed : player.speed;
  if(move!==0) player.facing=move;

  // smooth acceleration
  const accel = player.onGround ? 0.9 : 0.35;
  const desiredVx = move*targetSpeed;
  player.vx += (desiredVx - player.vx)*accel*dt;
  if(Math.abs(move)<0.1 && player.onGround){
    player.vx *= Math.pow(0.75, dt);
    if(Math.abs(player.vx)<0.1) player.vx=0;
  }

  // coyote & buffer
  if(player.onGround) player.coyote=8; else player.coyote=Math.max(0, player.coyote-dt);
  if(player.jumpBuffer>0) player.jumpBuffer-=dt;

  if(player.jumpBuffer>0 && (player.onGround || player.coyote>0)){
    player.vy=player.jumpForce;
    player.onGround=false;
    player.coyote=0;
    player.jumpBuffer=0;
    playSound('jump');
    spawnParticles(player.x+player.w/2, player.y+player.h, 6, '#fff');
    if(navigator.vibrate) navigator.vibrate(20);
  }

  // variable jump height
  if(!keys['Space'] && !keys['ArrowUp'] && !keys['KeyW'] && player.vy<-4){
    player.vy*=-0.5;
  }

  player.vy += 0.68*dt;
  if(player.vy>14) player.vy=14;

  // horizontal
  player.x += player.vx*dt;
  player.x = Math.max(0, Math.min(levelWidth-player.w, player.x));
  for(let plat of platforms){
    if(!rect(player, plat)) continue;
    if(player.vx>0) player.x=plat.x-player.w-0.1;
    else if(player.vx<0) player.x=plat.x+plat.w+0.1;
    player.vx=0;
  }
  for(let pipe of pipes){
    if(!rect(player, pipe)) continue;
    if(player.vx>0) player.x=pipe.x-player.w-0.1;
    else if(player.vx<0) player.x=pipe.x+pipe.w+0.1;
    player.vx=0;
  }

  // vertical
  player.wasOnGround=player.onGround;
  player.y += player.vy*dt;
  player.onGround=false;
  for(let plat of platforms){
    if(!rect(player, plat)) continue;
    if(player.vy>=0 && player.y+player.h-12 <= plat.y+10){
      player.y=plat.y-player.h;
      if(!player.wasOnGround && player.vy>5){
        spawnParticles(player.x+player.w/2, player.y+player.h, 8, '#C68642');
        shake=Math.min(6, player.vy*0.4);
      }
      player.vy=0;
      player.onGround=true;
    } else if(player.vy<0){
      player.y=plat.y+plat.h+0.1;
      player.vy=1;
    }
  }
  for(let pipe of pipes){
    if(!rect(player, pipe)) continue;
    if(player.vy>=0 && player.y+player.h-12 <= pipe.y+10){
      player.y=pipe.y-player.h;
      player.vy=0;
      player.onGround=true;
    } else if(player.vy<0){
      player.y=pipe.y+pipe.h;
      player.vy=1;
    }
  }

  // animation state
  if(!player.onGround){
    player.state = player.vy<0 ? 'jump' : 'fall';
  } else {
    if(Math.abs(player.vx)>0.5) player.state='run';
    else player.state='idle';
  }
  player.animTimer+=dt*Math.max(0.8, Math.abs(player.vx)*0.25);
  if(player.animTimer>6){ player.animFrame=(player.animFrame+1)%4; player.animTimer=0;
    if(player.state==='run' && player.onGround && Math.abs(player.vx)>2){
      spawnDust(player.x+player.w/2 - player.facing*10, player.y+player.h-2, -player.facing);
    }
  }

  // enemies
  for(let e of enemies){
    if(!e.alive) continue;
    e.anim+=0.18*dt;
    const min = e.patrol?e.patrol.min:e.x-260;
    const max = e.patrol?e.patrol.max:e.x+260;
    e.x+=e.vx*dt;

    // ground ahead check
    const frontX = e.dir<0? e.x-6 : e.x+e.w+6;
    let hasGround=false, hitWall=false;
    for(let plat of platforms){
      if(frontX>plat.x && frontX<plat.x+plat.w && e.y+e.h+8>=plat.y && e.y+e.h<=plat.y+18) hasGround=true;
      if(rect({x:e.x+e.vx*dt,y:e.y,w:e.w,h:e.h}, plat) && plat.y < e.y+e.h-12) hitWall=true;
    }
    for(let pipe of pipes){ if(rect({x:e.x+e.vx*dt,y:e.y,w:e.w,h:e.h}, pipe)) hitWall=true; }
    if(!hasGround||hitWall||e.x<min||e.x>max){ e.vx*=-1; e.dir*=-1; }

    e.vy=(e.vy||0)+0.68*dt; if(e.vy>10) e.vy=10;
    e.y+=e.vy*dt;
    for(let plat of platforms){
      if(rect(e,plat) && e.vy>=0 && e.y+e.h-14<=plat.y){ e.y=plat.y-e.h; e.vy=0; }
    }
    for(let pipe of pipes){
      if(rect(e,pipe) && e.vy>=0 && e.y+e.h-14<=pipe.y){ e.y=pipe.y-e.h; e.vy=0; }
    }

    if(rect(player,e)){
      if(player.vy>0 && player.y+player.h - e.y < 22){
        e.alive=false;
        player.vy=-9;
        score+=200;
        playSound('stomp');
        spawnParticles(e.x+e.w/2, e.y+e.h/2, 12, '#8B4513');
        shake=10;
        if(navigator.vibrate) navigator.vibrate(30);
        updateUI();
      } else if(player.invincible<=0){
        lives--;
        player.invincible=90;
        playSound('die');
        shake=14;
        spawnParticles(player.x+player.w/2, player.y+player.h/2, 10, '#E52521');
        if(lives<=0) return die();
        updateUI();
        player.vy=-7;
        player.vx=-player.facing*4;
        if(navigator.vibrate) navigator.vibrate([50,30,50]);
      }
    }
  }

  // coins
  for(let c of coinsList){
    if(c.taken) continue;
    c.bob+=0.09*dt;
    const r={x:c.x-6,y:c.y+Math.sin(c.bob)*5-6,w:22,h:22};
    if(rect(player,r)){
      c.taken=true; coins++; score+=100;
      playSound('coin');
      spawnParticles(c.x, c.y, 8, '#FFD700');
      if(navigator.vibrate) navigator.vibrate(15);
      updateUI();
    }
  }

  if(!flag.reached && player.x+player.w>flag.x-18 && player.x<flag.x+28){
    if(player.y+player.h>flag.poleY && player.y<flag.poleY+flag.h){ flag.reached=true; win(); }
  }

  if(player.y>H+120) return die();

  camera.targetX = player.x - W*0.38;
  camera.targetX = Math.max(0, Math.min(levelWidth-W, camera.targetX));
  camera.x += (camera.targetX - camera.x)*0.14*dt;

  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.18*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }
  for(let i=dustParticles.length-1;i>=0;i--){ const p=dustParticles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) dustParticles.splice(i,1); }

  if(player.invincible>0) player.invincible-=dt;
  if(shake>0) shake-=0.6*dt;
  if(frameCount%20===0) document.getElementById('timer').textContent=Math.ceil(timeLeft);
}

function die(){
  if(gameState!=='playing') return;
  lives--;
  if(lives<0) lives=0;
  playSound('die');
  if(lives<=0){
    gameState='dead';
    document.getElementById('finalScoreLose').textContent=score;
    document.getElementById('gameOverScreen').style.display='flex';
  } else {
    player.x=Math.max(0, player.x-260);
    player.y=GROUND_Y-200;
    player.vy=0; player.vx=0;
    player.invincible=120;
  }
  updateUI();
}
function win(){
  if(gameState!=='playing') return;
  gameState='win';
  playSound('win');
  score+= Math.floor(timeLeft)*15 + coins*100;
  document.getElementById('finalCoins').textContent=coins;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('winScreen').style.display='flex';
  updateUI();
}
function updateUI(){
  document.getElementById('coinCount').textContent=String(coins).padStart(2,'0');
  document.getElementById('score').textContent=String(score).padStart(4,'0');
  let h=''; for(let i=0;i<3;i++) h+= i<lives?'♥':'♡'; document.getElementById('lives').textContent=h;
}

/* DRAW - HD CRISP */
function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake*1.8, (Math.random()-0.5)*shake*1.2);

  // sky gradient crisp
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#5C94FC'); grad.addColorStop(1,'#9ED8FF');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // hills parallax
  ctx.save(); ctx.translate(-camera.x*0.18,0);
  for(let hill of hills) drawHillHD(hill.x, hill.y, hill.w, hill.h);
  ctx.restore();

  ctx.save(); ctx.translate(-camera.x*0.35,0);
  for(let cl of clouds) drawCloudHD(cl.x, cl.y, cl.w, cl.h);
  ctx.restore();

  ctx.save(); ctx.translate(-camera.x*0.6,0);
  for(let b of bushes) drawBushHD(b.x,b.y,b.w,b.h);
  ctx.restore();

  ctx.save(); ctx.translate(-camera.x,0);

  for(let plat of platforms){
    if(plat.x+plat.w < camera.x-120 || plat.x>camera.x+W+120) continue;
    drawPlatformHD(plat);
  }
  for(let pipe of pipes){
    if(pipe.x+pipe.w < camera.x-120 || pipe.x>camera.x+W+120) continue;
    drawPipeHD(pipe);
  }

  drawFlagHD(flag);

  for(let c of coinsList){
    if(c.taken) continue;
    if(c.x < camera.x-60 || c.x>camera.x+W+60) continue;
    drawCoinHD(c);
  }
  for(let e of enemies){
    if(!e.alive) continue;
    if(e.x < camera.x-100 || e.x>camera.x+W+100) continue;
    drawEnemyHD(e);
  }

  drawPlayerHD();

  for(let p of dustParticles){
    ctx.globalAlpha=p.life/p.maxLife*0.6;
    ctx.fillStyle='#C68642';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(let p of particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x|0, p.y|0, p.size|0, p.size|0);
  }
  ctx.globalAlpha=1;

  ctx.restore();
  ctx.restore();
}

function drawPlatformHD(p){
  if(p.type==='ground'){
    ctx.fillStyle='#C68642'; ctx.fillRect(p.x,p.y,p.w,p.h);
    // grass
    ctx.fillStyle='#00A800'; ctx.fillRect(p.x,p.y,p.w,22);
    ctx.fillStyle='#00D800'; ctx.fillRect(p.x,p.y,p.w,8);
    ctx.fillStyle='#007000';
    for(let x=p.x;x<p.x+p.w;x+=22){ ctx.fillRect(x+6,p.y+8,5,14); }
    // dirt pattern
    ctx.fillStyle='#A05A2C';
    for(let i=0;i<p.w/28;i++){ const rx=p.x+(i*53)%p.w, ry=p.y+28+(i*31)%(p.h-28); ctx.fillRect(rx,ry,6,6); }
    // outline
    ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#000'; ctx.fillRect(p.x,p.y,p.w,4);
  } else {
    // brick HD
    ctx.fillStyle='#E52521'; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#FF6B6B'; ctx.fillRect(p.x,p.y,p.w,6);
    ctx.fillStyle='#8B0000'; ctx.fillRect(p.x,p.y+p.h-6,p.w,6);
    ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(p.x,p.y,p.w,p.h);
    // mortar
    ctx.fillStyle='#000'; ctx.fillRect(p.x,p.y+p.h/2-2,p.w,4);
    const third=p.w/3;
    for(let i=1;i<3;i++){ ctx.fillRect(p.x+i*third-2,p.y,4,p.h/2); ctx.fillRect(p.x+i*third-third/2-2,p.y+p.h/2,4,p.h/2); }
    // highlight dots
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(p.x+4,p.y+4,third-8,6);
  }
}
function drawPipeHD(pipe){
  ctx.fillStyle='#00A800'; ctx.fillRect(pipe.x,pipe.y,pipe.w,pipe.h);
  ctx.fillStyle='#00D800'; ctx.fillRect(pipe.x,pipe.y,pipe.w,12);
  ctx.fillStyle='#007000'; ctx.fillRect(pipe.x+10,pipe.y+12,10,pipe.h-12);
  // top
  ctx.fillStyle='#00A800'; ctx.fillRect(pipe.x-10,pipe.y,pipe.w+20,26);
  ctx.fillStyle='#00D800'; ctx.fillRect(pipe.x-10,pipe.y,pipe.w+20,10);
  ctx.fillStyle='#007000'; ctx.fillRect(pipe.x-10,pipe.y+20,pipe.w+20,6);
  ctx.strokeStyle='#000'; ctx.lineWidth=4;
  ctx.strokeRect(pipe.x-10,pipe.y,pipe.w+20,26);
  ctx.strokeRect(pipe.x,pipe.y+26,pipe.w,pipe.h-26);
}
function drawCloudHD(x,y,w,h){
  ctx.fillStyle='#fff';
  ctx.strokeStyle='#000'; ctx.lineWidth=4;
  ctx.beginPath();
  ctx.arc(x+w*0.25,y+h*0.5,w*0.28,h*0.5,0,Math.PI*2);
  ctx.arc(x+w*0.55,y+h*0.45,w*0.32,h*0.6,0,Math.PI*2);
  ctx.arc(x+w*0.8,y+h*0.5,w*0.26,h*0.5,0,Math.PI*2);
  ctx.fill(); ctx.stroke();
  // bottom flat
  ctx.fillStyle='#fff'; ctx.fillRect(x+w*0.15,y+h*0.5,w*0.7,h*0.35);
  ctx.fillStyle='#000'; ctx.fillRect(x+w*0.15,y+h*0.8,w*0.7,4);
}
function drawHillHD(x,y,w,h){
  ctx.fillStyle='#00B800';
  ctx.beginPath(); ctx.moveTo(x,y+h); ctx.quadraticCurveTo(x+w*0.5,y-18,x+w,y+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#009000'; ctx.beginPath(); ctx.moveTo(x+w*0.7,y+h); ctx.quadraticCurveTo(x+w*0.5,y-10,x+w,y+h); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,y+h); ctx.quadraticCurveTo(x+w*0.5,y-18,x+w,y+h); ctx.stroke();
}
function drawBushHD(x,y,w,h){
  ctx.fillStyle='#00A800';
  for(let i=0;i<3;i++){ const cx=x+w*0.22+i*w*0.28, cy=y+h*0.55; ctx.beginPath(); ctx.arc(cx,cy,h*0.9,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke(); }
}
function drawFlagHD(f){
  ctx.fillStyle='#000'; ctx.fillRect(f.x-2,f.poleY-4,16,f.h+4);
  ctx.fillStyle='#fff'; ctx.fillRect(f.x,f.poleY,8,f.h);
  ctx.fillStyle='#000'; ctx.fillRect(f.x+2,f.poleY,2,f.h);
  ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(f.x+4,f.poleY,12,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.stroke();
  const wave = Math.sin(Date.now()/180)*3;
  ctx.fillStyle='#E52521'; ctx.fillRect(f.x+12,f.poleY+18+wave,54,36);
  ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeRect(f.x+12,f.poleY+18+wave,54,36);
  ctx.fillStyle='#fff'; ctx.font='bold 20px "Press Start 2P"'; ctx.fillText('GOAL',f.x+16,f.poleY+42+wave);
  // castle
  ctx.fillStyle='#C8C8C8'; ctx.fillRect(f.x+90,GROUND_Y-140,100,140);
  ctx.fillStyle='#A8A8A8'; ctx.fillRect(f.x+90,GROUND_Y-140,100,24);
  ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeRect(f.x+90,GROUND_Y-140,100,140);
  for(let i=0;i<5;i++){ ctx.fillStyle='#C8C8C8'; ctx.fillRect(f.x+90+i*20,GROUND_Y-164,14,24); ctx.strokeRect(f.x+90+i*20,GROUND_Y-164,14,24); }
  ctx.fillStyle='#000'; ctx.fillRect(f.x+125,GROUND_Y-60,30,60);
  ctx.fillStyle='#FFD700'; ctx.fillRect(f.x+132,GROUND_Y-45,6,6);
}
function drawCoinHD(c){
  const bobY = c.y + Math.sin(c.bob)*7;
  ctx.save(); ctx.translate(c.x+10,bobY+10);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(0,24,14,6,0,0,Math.PI*2); ctx.fill();
  // coin body
  const pulse = 0.9 + Math.sin(c.bob*2)*0.1;
  ctx.scale(pulse,1);
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(1,2,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFD700'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFA500'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FFFF6B'; ctx.beginPath(); ctx.arc(-3,-4,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.lineWidth=2.5; ctx.strokeStyle='#000'; ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawEnemyHD(e){
  const x=e.x, y=e.y, wobble = Math.sin(e.anim)*2;
  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+6,w*0.6,6,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle='#8B4513'; ctx.fillRect(x,y+wobble,w,e.h);
  ctx.fillStyle='#A05A2C'; ctx.fillRect(x,y+wobble,w,8);
  ctx.fillStyle='#5A2E0C'; ctx.fillRect(x,y+wobble+e.h-8,w,8);
  // feet
  const step = Math.sin(e.anim*2)>0?2:-2;
  ctx.fillStyle='#000'; ctx.fillRect(x+3,y+e.h-6+ (step>0?step:0),10,8); ctx.fillRect(x+w-13,y+e.h-6+ (step<0?-step:0),10,8);
  ctx.fillStyle='#5A2E0C'; ctx.fillRect(x+3,y+e.h-6+ (step>0?step:0),10,4); ctx.fillRect(x+w-13,y+e.h-6+ (step<0?-step:0),10,4);
  // eyes
  ctx.fillStyle='#fff'; ctx.fillRect(x+5,y+8+wobble,10,12); ctx.fillRect(x+w-15,y+8+wobble,10,12);
  ctx.fillStyle='#000'; ctx.fillRect(x+5,y+8+wobble,10,3); ctx.fillRect(x+w-15,y+8+wobble,10,3);
  ctx.fillStyle='#000';
  const eyeOff = e.dir>0?3:0;
  ctx.fillRect(x+8+eyeOff,y+14+wobble,4,4); ctx.fillRect(x+w-12+eyeOff,y+14+wobble,4,4);
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(x,y+wobble,w,e.h);
  ctx.restore();
}
function drawPlayerHD(){
  const x=player.x, y=player.y;
  if(player.invincible>0 && Math.floor(player.invincible/4)%2===0) return;
  ctx.save();
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x+player.w/2,y+player.h+8,player.w*0.65,8,0,0,Math.PI*2); ctx.fill();

  const f=player.facing;
  ctx.scale(f,1);
  const dx = f===1? x : -x-player.w;

  // run tilt
  let tilt=0;
  if(player.state==='run') tilt = Math.sin(player.animFrame*1.5)*0.08*f;

  ctx.translate(dx+player.w/2, y+player.h/2);
  ctx.rotate(tilt);
  ctx.translate(-(dx+player.w/2), -(y+player.h/2));

  // shoes
  const runOff = player.state==='run' ? Math.sin(player.animFrame*2)*4 : 0;
  ctx.fillStyle='#000'; ctx.fillRect(dx+1, y+player.h-10+Math.abs(runOff*0.3), 14, 12); ctx.fillRect(dx+player.w-15, y+player.h-10+Math.abs(-runOff*0.3), 14, 12);
  ctx.fillStyle='#8B4513'; ctx.fillRect(dx+1, y+player.h-10+Math.abs(runOff*0.3), 14, 8); ctx.fillRect(dx+player.w-15, y+player.h-10+Math.abs(-runOff*0.3), 14, 8);
  ctx.fillStyle='#FFD700'; ctx.fillRect(dx+3, y+player.h-8+Math.abs(runOff*0.3), 10, 2); ctx.fillRect(dx+player.w-13, y+player.h-8+Math.abs(-runOff*0.3), 10, 2);

  // legs
  ctx.fillStyle='#0000CD'; ctx.fillRect(dx+4, y+38+runOff, 10, 12); ctx.fillRect(dx+player.w-14, y+38-runOff, 10, 12);
  ctx.fillStyle='#00008B'; ctx.fillRect(dx+4, y+44+runOff, 10, 6); ctx.fillRect(dx+player.w-14, y+44-runOff, 10, 6);

  // body overalls
  ctx.fillStyle='#0000CD'; ctx.fillRect(dx+2, y+28, player.w-4, 18);
  ctx.fillStyle='#00008B'; ctx.fillRect(dx+2, y+40, player.w-4, 6);
  // buttons
  ctx.fillStyle='#FFD700'; ctx.strokeStyle='#000'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(dx+7, y+32, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(dx+player.w-7, y+32, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // shirt
  ctx.fillStyle='#E52521'; ctx.fillRect(dx, y+26, player.w, 12);
  ctx.fillStyle='#FF6B6B'; ctx.fillRect(dx, y+26, player.w, 4);

  // head
  ctx.fillStyle='#FFDAB9'; ctx.fillRect(dx+3, y+8, player.w-6, 18);
  ctx.fillStyle='#000'; ctx.fillRect(dx+3, y+8, player.w-6, 18); ctx.strokeStyle='#000'; ctx.lineWidth=0; // outline via stroke rect later
  ctx.fillStyle='#FFDAB9'; ctx.fillRect(dx+4, y+9, player.w-8, 16);
  // mustache
  ctx.fillStyle='#5C3317'; ctx.fillRect(dx+3, y+20, player.w-6, 6);
  ctx.fillStyle='#3D2210'; ctx.fillRect(dx+3, y+24, player.w-6, 2);
  // eyes
  ctx.fillStyle='#fff'; ctx.fillRect(dx+6, y+12, 7, 8); ctx.fillRect(dx+player.w-13, y+12, 7, 8);
  ctx.fillStyle='#000'; ctx.fillRect(dx+6, y+12, 7, 2); ctx.fillRect(dx+player.w-13, y+12, 7, 2);
  ctx.fillRect(dx+8, y+16, 3, 3); ctx.fillRect(dx+player.w-11, y+16, 3, 3);
  // hat
  ctx.fillStyle='#E52521'; ctx.fillRect(dx, y, player.w, 14);
  ctx.fillStyle='#FF6B6B'; ctx.fillRect(dx, y, player.w, 5);
  ctx.fillStyle='#8B0000'; ctx.fillRect(dx, y+12, player.w, 4);
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(dx, y, player.w, 14);
  // M
  ctx.fillStyle='#fff'; ctx.fillRect(dx+8, y+2, 16, 10); ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.strokeRect(dx+8, y+2, 16, 10);
  ctx.fillStyle='#E52521'; ctx.font='bold 11px "Press Start 2P"'; ctx.fillText('M', dx+10, y+11);

  // outline body
  ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(dx+2, y+26, player.w-4, 20);

  ctx.restore();
}

buildLevel(); resetPlayer(); draw();
updateUI();
</script>
